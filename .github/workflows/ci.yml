name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Run on the example data
        run: |
          java -jar target/jobtext-0.1.0.jar --in examples/postings.csv --out target/report.md --csv target/summary.csv
          git diff --exit-code --no-index examples/report.md target/report.md
